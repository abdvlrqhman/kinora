name: glass_probe
description: Draws Kinora's liquid glass on an iOS simulator in CI (real Metal rendering, not the frosted fallback).
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  liquid_glass_renderer: 1.0.0-dev.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
