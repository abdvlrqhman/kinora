name: app

# Analyze + test, then build the Android APKs and the iPhone IPA.
# Tag vX.Y.Z to publish both as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - name: Pure Dart packages (format, analyze, offline tests)
        working-directory: packages
        run: |
          for d in release_parser ranking stremio swarm subtitles dlna; do
            [ -f "$d/pubspec.yaml" ] || continue
            echo "::group::$d"
            (cd "$d" && dart pub get && dart format --output=none --set-exit-if-changed . \
              && dart analyze --fatal-infos && dart test -x live)
            echo "::endgroup::"
          done
      - name: Engine (Dart layer)
        working-directory: packages/engine
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

  android:
    needs: [check, engine]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm64-android
          path: packages/engine/prebuilt/arm64-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm-neon-android
          path: packages/engine/prebuilt/arm-neon-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-x64-android
          path: packages/engine/prebuilt/x64-android
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build APKs
        env:
          KINORA_KEYSTORE: ${{ runner.temp }}/release.p12
          KINORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --build-number ${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "Kinora-${f#app-}"; done
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: kinora-android
          path: app/build/app/outputs/flutter-apk/Kinora-*.apk
          if-no-files-found: error

  e2e-android:
    name: end-to-end (Android emulator)
    needs: [check, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-x64-android
          path: packages/engine/prebuilt/x64-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm64-android
          path: packages/engine/prebuilt/arm64-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm-neon-android
          path: packages/engine/prebuilt/arm-neon-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run the end-to-end test on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd app && flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded
            cd app && (timeout 600 flutter test integration_test/glass_test.dart -d emulator-5554 --reporter expanded || echo "::warning::Real liquid glass did not render on the emulator (see log)")

  ios:
    needs: [check, engine]
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm64-ios
          path: packages/engine/ios/prebuilt
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build unsigned IPA (SideStore signs it on the phone)
        run: |
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }}
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry Kinora.ipa Payload && ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: kinora-ios
          path: app/dist/Kinora.ipa
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # Only the app builds, not the engine's libtorrent folders.
          pattern: kinora-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
