name: app

# Analyze + test, then build the Android APKs, the iPhone IPA and the
# Windows zip. Tag vX.Y.Z to publish them as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
# Kinora's Trakt app id (public, not a secret) comes from the repository
# variable TRAKT_CLIENT_ID; without it the builds have no Trakt sign-in.

jobs:
  engine:
    uses: ./.github/workflows/engine.yml

  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - name: Pure Dart packages (format, analyze, offline tests)
        working-directory: packages
        run: |
          for d in release_parser ranking stremio swarm subtitles dlna; do
            [ -f "$d/pubspec.yaml" ] || continue
            echo "::group::$d"
            (cd "$d" && dart pub get && dart format --output=none --set-exit-if-changed . \
              && dart analyze --fatal-infos && dart test -x live)
            echo "::endgroup::"
          done
      - name: Engine (Dart layer)
        working-directory: packages/engine
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

  android:
    needs: [check, engine]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm64-android
          path: packages/engine/prebuilt/arm64-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm-neon-android
          path: packages/engine/prebuilt/arm-neon-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-x64-android
          path: packages/engine/prebuilt/x64-android
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build APKs
        env:
          KINORA_KEYSTORE: ${{ runner.temp }}/release.p12
          KINORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=TRAKT_CLIENT_ID=${{ vars.TRAKT_CLIENT_ID }} \
            --target-platform android-arm,android-arm64 \
            --build-number ${{ github.run_number }}
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do mv "$f" "Kinora-${f#app-}"; done
          ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: kinora-android
          path: app/build/app/outputs/flutter-apk/Kinora-*.apk
          if-no-files-found: error

  e2e-android:
    name: end-to-end (Android emulator)
    needs: [check, engine]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-x64-android
          path: packages/engine/prebuilt/x64-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm64-android
          path: packages/engine/prebuilt/arm64-android
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm-neon-android
          path: packages/engine/prebuilt/arm-neon-android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run the end-to-end test on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          # (Output kept in e2e.log: the player screenshots come out of it.)
          script: |
            bash -o pipefail -c 'cd app && flutter test integration_test/app_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee ../e2e.log'
      - name: Player screenshots from the run
        if: always()
        run: python3 .github/scripts/e2e_shots.py e2e.log e2e-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-player-screenshots
          path: e2e-shots
          if-no-files-found: ignore
          retention-days: 14

  e2e-ios:
    name: end-to-end (iPhone simulator)
    needs: [check, engine]
    runs-on: macos-26
    timeout-minutes: 60
    # New: it doesn't hold back a release until it has proven steady.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm64-ios-simulator
          path: packages/engine/ios/prebuilt
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Boot an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in d if "iOS" in r), reverse=True)
          print(next(x["udid"] for r in ios for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Run the end-to-end test on the simulator
        working-directory: app
        run: |
          set -o pipefail
          flutter test integration_test/app_test.dart -d "${{ steps.sim.outputs.udid }}" --reporter expanded 2>&1 | tee ../e2e-ios.log
      - name: Player screenshots from the run
        if: always()
        run: python3 .github/scripts/e2e_shots.py e2e-ios.log e2e-shots
      # When the app quits mid-test ("did not complete"), the simulator's
      # crash report says where.
      - name: Crash reports
        if: failure()
        run: |
          mkdir -p crash-reports
          find ~/Library/Logs/DiagnosticReports -mmin -60 \( -name '*.ips' -o -name '*.crash' \) 2>/dev/null | head -20 | while read -r f; do cp "$f" crash-reports/; done
          ls crash-reports
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-iphone-crash-reports
          path: crash-reports
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-iphone-screenshots
          path: e2e-shots
          if-no-files-found: ignore
          retention-days: 14

  ios:
    needs: [check, engine]
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-arm64-ios
          path: packages/engine/ios/prebuilt
      - uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build unsigned IPA (SideStore signs it on the phone)
        run: |
          flutter build ios --release --no-codesign --build-number ${{ github.run_number }} \
            --dart-define=TRAKT_CLIENT_ID=${{ vars.TRAKT_CLIENT_ID }}
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qry Kinora.ipa Payload && ls -la
      - uses: actions/upload-artifact@v7
        with:
          name: kinora-ios
          path: app/dist/Kinora.ipa
          if-no-files-found: error

  windows:
    needs: [check, engine]
    runs-on: windows-2025
    # (New: a Windows problem doesn't hold up the phones' release.)
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-x64-windows-static-md
          path: packages/engine/prebuilt/x64-windows-static-md
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build Kinora for Windows
        run: |
          flutter build windows --release --build-number ${{ github.run_number }} \
            --dart-define=TRAKT_CLIENT_ID=${{ vars.TRAKT_CLIENT_ID }}
          mkdir -p dist
          cp -R build/windows/x64/runner/Release dist/Kinora
          # The Visual C++ runtime, next to Kinora.exe: a PC without it
          # (no other app installed it) would refuse to start Kinora.
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$f" dist/Kinora/
          done
          ls dist/Kinora
          cd dist && 7z a -tzip -bd Kinora-windows-x64.zip Kinora >/dev/null && ls -la
      # The installer people download (the zip stays, for a portable copy).
      - name: Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" windows/installer/kinora.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "The installer didn't build"; exit 1 }
          Get-Item dist/Kinora-Setup-x64.exe | Format-List Name, Length
      # Installs it as a person would, then starts the installed Kinora: it
      # must stay up and show its window (a missing DLL, a crash or a window
      # that never appears fails here, not on someone's PC). The screenshot is
      # the first launch as people see it. Then uninstalling must remove it.
      - name: Install, launch and uninstall
        shell: pwsh
        run: |
          Start-Process -FilePath dist/Kinora-Setup-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Kinora"
          if (-not (Test-Path "$dir\Kinora.exe")) { Write-Error "The installer didn't install Kinora.exe"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Kinora.lnk")) { Write-Error "No Start menu entry"; exit 1 }
          $p = Start-Process -FilePath "$dir\Kinora.exe" -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { Write-Error "Kinora.exe exited at launch"; exit 1 }
          if ($p.MainWindowHandle -eq 0) { Write-Error "Kinora.exe shows no window"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/dist/first-launch.png")
          Stop-Process -Id $p.Id -Force
          Start-Sleep -Seconds 2
          Start-Process -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # (The uninstaller hands over to a copy of itself and returns early.)
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\Kinora.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\Kinora.exe") { Write-Error "Uninstalling left Kinora.exe behind"; exit 1 }
          Write-Output 'Installed, launched and uninstalled'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-first-launch
          path: app/dist/first-launch.png
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: kinora-windows
          path: |
            app/dist/Kinora-Setup-x64.exe
            app/dist/Kinora-windows-x64.zip
          if-no-files-found: error

  e2e-windows:
    name: end-to-end (Windows)
    needs: [check, engine]
    runs-on: windows-2025
    timeout-minutes: 50
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-x64-windows-static-md
          path: packages/engine/prebuilt/x64-windows-static-md
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Run the end-to-end test on Windows
        run: |
          set -o pipefail
          # (Real-screen shots of full screen land with the player's.)
          cd app && flutter test integration_test/app_test.dart -d windows --reporter expanded \
            --dart-define=KINORA_OS_SHOTS="$GITHUB_WORKSPACE/e2e-shots" 2>&1 | tee ../e2e.log
      - name: Player screenshots from the run
        if: always()
        run: python .github/scripts/e2e_shots.py e2e.log e2e-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-windows-screenshots
          path: e2e-shots
          if-no-files-found: ignore
          retention-days: 14

  release:
    # Waits for Windows too, but publishes the phones' builds without it.
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.android.result == 'success' && needs.ios.result == 'success'
    needs: [android, ios, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits since the previous version
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # Only the app builds, not the engine's libtorrent folders.
          pattern: kinora-*
          merge-multiple: true
      # The changelog is the commits since the previous version (GitHub's
      # generated notes only list merged pull requests). The app shows it in
      # its update prompt.
      - name: The tag is the version the app was built as
        run: |
          built=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)
          [ "${GITHUB_REF_NAME#v}" = "$built" ] || { echo "::error::Tag $GITHUB_REF_NAME, but the app is built as $built"; exit 1; }
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          # (Test, CI and screenshot commits aren't news for the people
          # updating.)
          git log --no-merges --reverse --invert-grep \
            --grep='^E2E' --grep='^CI:' --grep='^Docs:' --grep='^Goldens:' --grep='^Engine test:' \
            --format='### %s%n%n%b' "$range" > notes.md
          [ -s notes.md ] || echo "Kinora ${GITHUB_REF_NAME#v}" > notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Kinora ${GITHUB_REF_NAME#v}" --notes-file notes.md
