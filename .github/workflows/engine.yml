name: engine

# libtorrent (+ OpenSSL, Boost) static libs for every target, then a native
# end-to-end test of the engine on Linux. Called by the app workflow; can also
# be run by hand.
on:
  workflow_call:
  workflow_dispatch:

env:
  VCPKG_COMMIT: ec48c11eae9448c8c6e7739d93e06fa2433aa95f # = builtin-baseline in vcpkg.json
  ANDROID_NDK_VERSION: 28.2.13676358                     # = Flutter 3.47's default NDK
  FLUTTER_VERSION: 3.47.7

jobs:
  libtorrent:
    name: libtorrent ${{ matrix.triplet }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triplet: arm64-android, os: ubuntu-24.04 }
          - { triplet: arm-neon-android, os: ubuntu-24.04 }
          - { triplet: x64-android, os: ubuntu-24.04 }
          - { triplet: x64-linux, os: ubuntu-24.04 }
          - { triplet: arm64-ios, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/engine
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bin,readwrite
    steps:
      - uses: actions/checkout@v7

      - name: Fetch vcpkg at pinned commit
        run: |
          git init -q "$RUNNER_TEMP/vcpkg"
          cd "$RUNNER_TEMP/vcpkg"
          git fetch -q --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_COMMIT"
          git checkout -q FETCH_HEAD
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Android NDK ${{ env.ANDROID_NDK_VERSION }}
        if: endsWith(matrix.triplet, '-android')
        run: |
          ndk="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          [ -d "$ndk" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ANDROID_NDK_VERSION" >/dev/null
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: .vcpkg-bin
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('packages/engine/vcpkg.json', 'packages/engine/triplets/**') }}
          restore-keys: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}-

      - name: Build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.vcpkg-bin"
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            --triplet "${{ matrix.triplet }}" \
            --overlay-triplets=triplets \
            --x-install-root=out \
            --clean-after-build

      - uses: actions/upload-artifact@v7
        with:
          name: libtorrent-${{ matrix.triplet }}
          retention-days: 7
          path: |
            packages/engine/out/${{ matrix.triplet }}/include
            packages/engine/out/${{ matrix.triplet }}/lib
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vcpkg-logs-${{ matrix.triplet }}
          path: ${{ runner.temp }}/vcpkg/buildtrees/**/*.log

  native-test:
    name: engine native e2e (linux)
    needs: libtorrent
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: libtorrent-x64-linux
          path: packages/engine/prebuilt/x64-linux
      - name: Build libkinora_engine (host)
        run: |
          cmake -S packages/engine/src -B build/engine -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine -j 4
          echo "KINORA_ENGINE_LIB=$PWD/build/engine/libkinora_engine.so" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Test
        working-directory: packages/engine
        run: |
          flutter pub get
          flutter test --reporter expanded
