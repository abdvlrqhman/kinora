name: kinora
description: "Kinora: stream or download from torrents and debrid with one player."
publish_to: 'none'
version: 0.1.8+9

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  background_downloader: ^9.6.6
  cached_network_image: ^4.0.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.3
  http: ^1.6.0
  kinora_engine:
    path: ../packages/engine
  stremio:
    path: ../packages/stremio
  swarm:
    path: ../packages/swarm
  dlna:
    path: ../packages/dlna
  release_parser:
    path: ../packages/release_parser
  ranking:
    path: ../packages/ranking
  liquid_glass_renderer: 1.0.0-dev.2
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  network_info_plus: ^8.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  wakelock_plus: ^1.8.2
  screen_brightness: ^2.1.11
  volume_controller: ^3.7.1
  flutter_foreground_task: ^11.0.3
  connectivity_plus: ^7.3.2
  subtitles:
    path: ../packages/subtitles
  url_launcher: ^6.3.3
  audio_session: ^0.2.4

dev_dependencies:
  build_runner: ^2.17.1
  crypto: ^3.0.8
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: BigShoulders
      fonts:
        - asset: assets/fonts/BigShouldersDisplay.ttf
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree.ttf

# Generated from assets/icon/*.png (tool/render_icon_test.dart).
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#17141B"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  remove_alpha_ios: true
  min_sdk_android: 26
